<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="banner">DarkScan demo shop. This is a test site with intentional dark-pattern examples. It is not a real store.</p>
      <h1>Checkout</h1>
      <p>Account is required to continue.</p>
      <p><a href="/guest">Continue as guest</a></p>
      <fieldset>
        <legend>Shipping</legend>
        <label><input type="radio" name="shipping" value="premium" checked /> Premium express shipping</label>
        <label><input type="radio" name="shipping" value="standard" /> Standard shipping</label>
      </fieldset>
    </main>
  </body>
</html>
